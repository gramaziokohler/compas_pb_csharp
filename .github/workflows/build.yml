name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
        dotnet: ["9.0.x"]
        framework: [netstandard2.0, net9.0]
        include:
          - os: windows-latest
            dotnet: "9.0.x"
            framework: net48

    defaults:
      run:
        working-directory: src/CompasPb

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ matrix.dotnet }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch compas_pb assets
        run: python ../../fetch_compas_pb.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore
        run: dotnet restore

      # Pinned in .config/dotnet-tools.json. Installing the tool globally and unpinned meant a
      # new CSharpier release could change the formatting rules and fail main with no code
      # change — 1.3 started formatting XML, which is exactly that.
      - name: Restore dotnet tools
        working-directory: ${{ github.workspace }}
        run: dotnet tool restore

      - name: Check formatting
        working-directory: ${{ github.workspace }}
        run: dotnet csharpier check .

      - name: Build
        run: dotnet build --configuration Release --no-restore -f ${{ matrix.framework }}

      - name: Test
        if: matrix.framework == 'net9.0' || (matrix.framework == 'net48' && matrix.os == 'windows-latest')
        working-directory: ${{ github.workspace }}
        run: dotnet test test/CompasPb.Test.csproj --configuration Release --verbosity normal -f ${{ matrix.framework }}

      # The example compiles against the sources through a ProjectReference, so building it is
      # what catches a breaking API change that the tests happen not to exercise.
      - name: Build the example
        if: matrix.framework == 'net9.0'
        working-directory: ${{ github.workspace }}
        run: dotnet build example/UserCase/CompasPb.UserCase.csproj --configuration Release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CompasPb-CSharp-Artifact-${{ matrix.os }}-${{ matrix.framework }}
          path: src/CompasPb/bin/Release/${{ matrix.framework }}/
          retention-days: 1

  upm:
    name: upm package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch compas_pb assets
        run: python fetch_compas_pb.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore
        run: dotnet restore

      - name: Build and validate the Unity package
        run: python build_upm.py --validate

      - name: Upload Unity package
        uses: actions/upload-artifact@v4
        with:
          name: dev.compas.compas-pb
          path: upm/dev.compas.compas-pb
          retention-days: 1
