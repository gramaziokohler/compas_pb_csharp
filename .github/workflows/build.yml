name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ windows-latest, macos-latest ]
        dotnet: ["9.0.x"]

    defaults:
      run:
        working-directory: src/CompasPb

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ matrix.dotnet }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch compas_pb_assets
        run: python ../../fetch_compas_pb.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: .Net Restore
        run: dotnet restore

      # - name: Install CSharpier
      #   run: dotnet tool install -g csharpier

      # - name: Check Formatting
      #   working-directory: ${{ github.workspace }}
      #   run: csharpier check .

      - name: Formating
        working-directory: ${{ github.workspace }}
        run: dotnet format --verify-no-changes --verbosity diagnostic

      - name: .NET Build
        run: dotnet build --configuration Release --no-restore

      # add the test when it is ready
      # - name: .NET Test
      #   run: dotnet test --no-build --berbosity normal

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: CompasPb-CSharp-Artifact-${{ matrix.os }}
          path: src/CompasPb/bin/Release/
          retention-days: 1
