name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
        dotnet: ["9.0.x"]
        framework: [netstandard2.0, net9.0]
        include:
          - os: windows-latest
            dotnet: "9.0.x"
            framework: net48

    defaults:
      run:
        working-directory: src/CompasPb

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ matrix.dotnet }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch compas_pb assets
        run: python ../../fetch_compas_pb.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore
        run: dotnet restore

      - name: Install CSharpier
        run: |
          dotnet tool install -g csharpier
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Check formatting
        working-directory: ${{ github.workspace }}
        run: csharpier check .

      - name: Build
        run: dotnet build --configuration Release --no-restore -f ${{ matrix.framework }}

      - name: Test
        if: matrix.framework == 'net9.0'
        working-directory: ${{ github.workspace }}
        run: dotnet test test/CompasPb.Test.csproj --configuration Release --verbosity normal

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CompasPb-CSharp-Artifact-${{ matrix.os }}-${{ matrix.framework }}
          path: src/CompasPb/bin/Release/${{ matrix.framework }}/
          retention-days: 1
