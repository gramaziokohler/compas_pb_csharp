name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        dotnet: ["9.0.x"]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ matrix.dotnet }}

      - name: .Net Restore
        run: dotnet restore

      - name: .NET Build
        run: dotnet build --no-restore

      - name: .NET Format
        run: dotnet format *.sln --verify-no-changes --verbosity diagnostic
