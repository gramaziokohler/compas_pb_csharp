name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        dotnet: ["9.0.x"]

    defaults:
      run:
        working-directory: src/CompasPb

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ matrix.dotnet }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch comaps_pb_assets
        run: python ../../fetch_compas_pb.py

      - name: .Net Restore
        run: dotnet restor

      - name: .NET Build
        run: dotnet build --no-restore

      # - name: .NET Test
      #   run: dotnet test --no-build --berbosity normal

      - name: .NET Format
        run: dotnet format --verify-no-changes

      - name: Upload build artifacts
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            src/CompasPb/bin/Debug/netstandard2.1/*.dll
            retention-days:1
