name: release

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # release-please maintains a release pull request from conventional commits.
  # Merging it bumps version.json and the Unity package.json, writes CHANGELOG.md,
  # tags vX.Y.Z, and creates the GitHub release. Everything below publishes into
  # that release and only runs on the push that merged it.
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-and-test:
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
        dotnet: ["9.0.x"]

    defaults:
      run:
        working-directory: src/CompasPb

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ matrix.dotnet }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch compas_pb assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python ../../fetch_compas_pb.py

      - name: Restore
        run: dotnet restore

      - name: Install CSharpier
        run: |
          dotnet tool install -g csharpier
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Check formatting
        working-directory: ${{ github.workspace }}
        run: csharpier check .

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        working-directory: ${{ github.workspace }}
        run: dotnet test test/CompasPb.Test.csproj --configuration Release --verbosity normal

  publish:
    needs: [release-please, build-and-test]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
        dotnet: ["9.0.x"]
        framework: [net9.0]
        include:
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ matrix.dotnet }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch compas_pb assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python fetch_compas_pb.py

      - name: Restore
        run: dotnet restore

      - name: Publish (${{ matrix.os }})
        shell: bash
        run: |
          OUTPUT_PATH="${{ github.workspace }}/release_artifacts/${{ matrix.os }}/${{ matrix.framework }}"

          dotnet publish src/CompasPb/CompasPb.csproj -c Release \
            --self-contained true \
            -r ${{ matrix.rid }} \
            -f ${{ matrix.framework }} \
            -o "$OUTPUT_PATH"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: compas-pb-dist-${{ matrix.os }}-${{ matrix.framework }}
          path: ${{ github.workspace }}/release_artifacts/${{ matrix.os }}/${{ matrix.framework }}
          if-no-files-found: error

  nuget-publish:
    needs: [release-please, build-and-test]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: src/CompasPb

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch compas_pb assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python ../../fetch_compas_pb.py

      - name: Restore
        run: dotnet restore

      - name: Pack
        shell: bash
        run: |
          VERSION="${{ needs.release-please.outputs.version }}"
          dotnet pack CompasPb.csproj \
            --configuration Release \
            --no-restore \
            -p:PublicRelease=true \
            -o ${{ github.workspace }}/nupkg

          test -f "${{ github.workspace }}/nupkg/CompasPb.${VERSION}.nupkg"
          test -f "${{ github.workspace }}/nupkg/CompasPb.${VERSION}.snupkg"

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: compas-pb-nuget
          path: ${{ github.workspace }}/nupkg/CompasPb.*nupkg
          if-no-files-found: error

      - name: Check NuGet account configuration
        shell: bash
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if [[ -z "$NUGET_USER" ]]; then
            echo "ERROR: Add NUGET_USER to the repository's Actions variables."
            exit 1
          fi

      - name: NuGet login (OIDC to temporary API key)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to NuGet.org
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          VERSION="${{ needs.release-please.outputs.version }}"
          for package in nupkg snupkg; do
            dotnet nuget push "${{ github.workspace }}/nupkg/CompasPb.${VERSION}.${package}" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

  # OpenUPM packs the tree at a tag and never builds, so the compiled package is
  # published to a dedicated branch whose tags carry only the Unity artifacts.
  # main stays free of binaries.
  upm-publish:
    needs: [release-please, build-and-test]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch compas_pb assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python fetch_compas_pb.py

      - name: Restore
        run: dotnet restore

      - name: Build the Unity package
        run: python build_upm.py --validate

      - name: Publish to the upm branch
        shell: bash
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          PACKAGE_DIR="upm/dev.compas.compas-pb"
          TAG="upm/v${VERSION}"

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "ERROR: ${TAG} already exists."
            exit 1
          fi

          STAGE=$(mktemp -d)
          cp -R "${PACKAGE_DIR}/." "${STAGE}/"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Continue the upm branch when it exists so its history stays linear.
          if git ls-remote --exit-code --heads origin upm >/dev/null 2>&1; then
            git fetch --depth=1 origin upm
            git checkout -B upm FETCH_HEAD
          else
            git checkout --orphan upm
          fi

          git rm -rq --cached . || true
          find . -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
          cp -R "${STAGE}/." .

          git add -A
          git commit -m "Unity package ${VERSION}"
          git push origin upm
          git tag "$TAG"
          git push origin "$TAG"

          echo "Published ${TAG} to the upm branch."

  upload-release-assets:
    needs: [release-please, publish, nuget-publish, upm-publish]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download published artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-assets

      - name: Zip platform artifacts
        run: |
          cd ./release-assets
          for dir in compas-pb-dist-*; do
              if [ -d "$dir" ]; then
                  cleaned=$(echo "$dir" | sed 's/compas-pb-dist-//g')
                  zip_name="compas-pb-${cleaned}.zip"
                  echo "Processing: $dir -> $zip_name"
                  mv "$dir" "$cleaned"
                  zip -r "$zip_name" "$cleaned"
                  rm -rf "$cleaned"
              fi
          done

      - name: Attach assets to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            ./release-assets/*.zip --clobber
