name: release

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  # ── Bump: manually triggered to create a release branch ──
  bump:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump version
        uses: ./.github/actions/bump
        with:
          bump: ${{ inputs.bump }}

  # ── Release: fires on push to main ──
  check-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ steps.check.outputs.is_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if this is a release merge
        id: check
        run: |
          # Check if the merge came from a release/** branch
          MERGE_MSG=$(git log -1 --pretty=%s)
          echo "Last commit: $MERGE_MSG"

          if echo "$MERGE_MSG" | grep -qE "^Merge (pull request|branch) .* (from |')?release/"; then
            # Extract version from CHANGELOG.md — first ## [x.y.z] entry
            VERSION=$(grep -m1 "^## \[[0-9]" CHANGELOG.md | sed 's/## \[\(.*\)\].*/\1/')
            if [[ -z "$VERSION" ]]; then
              echo "ERROR: No versioned section found in CHANGELOG.md. Add ## [x.y.z] before merging."
              exit 1
            fi
            echo "Release detected: $VERSION"
            echo "is_release=true" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          else
            echo "Not a release merge — skipping."
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi

  build-and-test:
    needs: [check-release]
    if: needs.check-release.outputs.is_release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
        dotnet: ["9.0.x"]

    defaults:
      run:
        working-directory: src/CompasPb

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ matrix.dotnet }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch compas_pb assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python ../../fetch_compas_pb.py

      - name: Restore
        run: dotnet restore

      - name: Install CSharpier
        run: |
          dotnet tool install -g csharpier
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Check formatting
        working-directory: ${{ github.workspace }}
        run: csharpier check .

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        working-directory: ${{ github.workspace }}
        run: dotnet test test/CompasPb.Test.csproj --configuration Release --verbosity normal

  publish:
    needs: [check-release, build-and-test]
    if: needs.check-release.outputs.is_release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
        dotnet: ["9.0.x"]
        framework: [net9.0]
        include:
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-x64

    defaults:
      run:
        working-directory: src/CompasPb

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ matrix.dotnet }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch compas_pb assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python ../../fetch_compas_pb.py

      - name: Restore
        run: dotnet restore

      - name: Publish (${{ matrix.os }})
        shell: bash
        run: |
          OUTPUT_PATH="${{ github.workspace }}/release_artifacts/${{ matrix.os }}/${{ matrix.framework }}"
          PROJECT_FILE="${{ github.workspace }}/src/CompasPb/CompasPb.csproj"

          dotnet publish "$PROJECT_FILE" -c Release \
            --self-contained true \
            -r ${{ matrix.rid }} \
            -f ${{ matrix.framework }} \
            -o "$OUTPUT_PATH"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: compas-pb-dist-${{ matrix.os }}-${{ matrix.framework }}
          path: ${{ github.workspace }}/release_artifacts/${{ matrix.os }}/${{ matrix.framework }}
          if-no-files-found: error

  nuget-publish:
    needs: [check-release, build-and-test]
    if: needs.check-release.outputs.is_release == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/CompasPb

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch compas_pb assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python ../../fetch_compas_pb.py

      - name: Restore
        run: dotnet restore

      - name: Pack
        run: |
          dotnet pack CompasPb.csproj \
            --configuration Release \
            --no-restore \
            -o ${{ github.workspace }}/nupkg

      - name: Push to NuGet.org
        run: |
          dotnet nuget push "${{ github.workspace }}/nupkg/*.nupkg" \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

  release:
    needs: [check-release, publish, nuget-publish]
    if: needs.check-release.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"

      - name: Install nbgv
        run: |
          dotnet tool install -g nbgv
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Create and push tag
        run: |
          VERSION=${{ needs.check-release.outputs.version }}
          TAG="v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          echo "tag=$TAG" >> $GITHUB_ENV

      - name: Download all published artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-assets

      - name: Zip artifacts
        run: |
          cd ./release-assets
          for dir in compas-pb-dist-*; do
              if [ -d "$dir" ]; then
                  cleaned=$(echo "$dir" | sed 's/compas-pb-dist-//g')
                  zip_name="compas-pb-${cleaned}.zip"
                  echo "Processing: $dir -> $zip_name"
                  mv "$dir" "$cleaned"
                  zip -r "$zip_name" "$cleaned"
                  rm -rf "$cleaned"
              fi
          done

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.tag }}
          name: Release ${{ needs.check-release.outputs.version }}
          files: ./release-assets/*.zip
          body_path: CHANGELOG.md
